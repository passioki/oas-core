[package]
name = "oas-task"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
oas-types = { workspace = true }
oas-codec = { workspace = true }
oas-perceive = { workspace = true }
oas-flow = { workspace = true }
oas-runtime = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# TaskPackage (.oaspkg) container + payload digests (Runner Studio PR5, §B.1).
# `default-features = false` keeps the closure pure Rust and avoids pulling in
# bzip2/time/zstd system-adjacent features the package format never uses.
zip = { version = "0.6", default-features = false, features = ["deflate"] }
sha2 = "0.10"
