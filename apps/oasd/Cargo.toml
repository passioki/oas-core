[package]
name = "oasd"
version.workspace = true
edition.workspace = true
license.workspace = true

# Phase 1a (Runner/Studio split): the application is a library + a thin binary.
# The library name stays `oasd` so `oasd::cli::run()` / `run_as("runner")` are
# available to the separate oas-runner application; the bin target only calls
# into it (see src/main.rs).
[lib]
name = "oasd"
path = "src/lib.rs"

[[bin]]
name = "oasd"
path = "src/main.rs"

[dependencies]
oas-types = { workspace = true }
oas-adapter-pc = { workspace = true }
oas-codec = { workspace = true }
oas-obs = { workspace = true }
oas-runtime = { workspace = true }
oas-perceive = { workspace = true }
oas-flow = { workspace = true }
oas-task = { workspace = true }
oas-ocr = { workspace = true, optional = true, features = ["onnx"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
ocr = ["dep:oas-ocr"]
