[package]
name = "oasd"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "oasd"
path = "src/main.rs"

[dependencies]
oas-types = { workspace = true }
oas-adapter-pc = { workspace = true }
oas-codec = { workspace = true }
oas-obs = { workspace = true }
oas-ocr = { workspace = true, optional = true, features = ["onnx"] }

[features]
ocr = ["dep:oas-ocr"]
