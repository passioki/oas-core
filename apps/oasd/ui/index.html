<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>OAS 引擎编辑器 · MVP</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <strong>OAS 引擎编辑器</strong>
    <span id="status" class="muted">连接中…</span>
    <span class="spacer"></span>
    <button id="btn-capture">截图</button>
  </header>

  <main>
    <section id="canvas-wrap">
      <canvas id="screen" width="1280" height="720"></canvas>
      <div id="hint" class="muted">在画面上拖拽选择 ROI</div>
    </section>

    <aside>
      <h3>ROI</h3>
      <div id="roi" class="kv">未选择</div>
      <h3>操作</h3>
      <button id="btn-ocr" disabled>试识别 (OCR 单行)</button>
      <button id="btn-lines" disabled>多行识别 (det+rec)</button>
      <button id="btn-match" disabled>试匹配（图识别，全帧搜索）</button>
      <button id="btn-poly">多边形框选（点顶点，双击闭合）</button>

      <button id="btn-click-step" disabled>生成点击指令（选中识别区块）</button>
      <button id="btn-append-step" disabled>追加到 flow</button>

      <button id="btn-clear">清除 ROI</button>

      <h3>点击分布（常设）</h3>
      <label class="opt">运行记录
        <select id="runs-select">
          <option value="">（未加载）</option>
        </select>
      </label>
      <div class="row">
        <button id="btn-runs-refresh">刷新运行记录</button>
        <button id="btn-clicks-overlay">叠加分布</button>
      </div>
      <button id="btn-clicks-clear">清除分布</button>
      <div id="click-stats" class="kv mono">clicks=— distinct=—</div>
      <div id="clicks-legend" class="clicks-legend">
        <span class="muted">稀疏</span><span class="ramp"></span><span class="muted">密集</span>
        <span class="dot"></span><span class="muted">单次点击</span>
      </div>
      <div id="clicks-status" class="muted small">—</div>

      <h3>运行统计（长跑）</h3>
      <button id="btn-stats-refresh">刷新统计</button>
      <pre id="stats-summary" class="muted">—</pre>

      <h3>任务</h3>
      <label class="opt"><input id="task-name" placeholder="任务名，如：队伍预设" value="任务1" /></label>
      <h3>存为素材</h3>
      <label class="opt"><input id="asset-id" placeholder="素材 id，如：队伍预设入口" /></label>
      <label class="opt">类型
        <select id="asset-kind">
          <option value="template">template（模板图）</option>
          <option value="ocr_line">ocr_line（单行文字）</option>
          <option value="ocr_lines">ocr_lines（多行文字）</option>
        </select>
      </label>
      <button id="btn-asset" disabled>生成素材 JSON</button>
      <button id="btn-save-asset" disabled>保存素材到任务</button>
      <h3>flow.json</h3>
      <textarea id="flow-json" rows="8" spellcheck="false" placeholder='{"schema_version":1,"name":"任务1","steps":[{"op":"click","args":{"sel":"分组2"}},{"op":"finish","args":{"exit":"done"}}]}'></textarea>
      <button id="btn-save-flow">保存 flow（校验引用）</button>
      <h3>流程编辑器（可视化）</h3>
      <div class="row flow-toolbar">
        <select id="flow-op"></select>
        <button id="flow-add-step">添加步骤</button>
        <button id="flow-from-json">从 JSON 载入</button>
        <button id="flow-to-json">生成 JSON</button>
        <button id="flow-save-viz">生成并保存</button>
      </div>
      <div id="flow-steps" class="flow-steps muted">（从任务载入或点「从 JSON 载入」）</div>
      <h4>弹窗规则（interrupts）</h4>
      <div id="flow-interrupts" class="flow-steps muted">（无）</div>
      <button id="flow-add-interrupt">添加弹窗规则</button>
      <p class="muted small">带 if/loop 的流程请用 JSON 文本模式；可视化模式拒绝 flatten（避免丢内容）。</p>
      <h3>任务素材</h3>
      <pre id="assets-summary" class="muted">—</pre>

      <h3>结果</h3>
      <pre id="result" class="muted">—</pre>
      <h3>日志</h3>
      <pre id="log"></pre>
    </aside>
  </main>

  <script src="/flow_model.js"></script>
  <script src="/app.js"></script>
</body>
</html>
