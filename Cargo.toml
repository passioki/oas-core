[workspace]
resolver = "2"
members = [
    "crates/oas-types",
    "crates/oas-codec",
    "crates/oas-perceive",
    "crates/oas-obs",
    "crates/oas-flow",
    "crates/oas-ocr",
    "crates/oas-runtime",
    "crates/oas-task",
    "crates/oas-adapter-pc",
    "apps/oasd",
]

[workspace.package]
version = "1.2.2"
edition = "2021"
rust-version = "1.75"
license = "MIT"

[workspace.dependencies]
oas-types = { path = "crates/oas-types" }
oas-codec = { path = "crates/oas-codec" }
oas-perceive = { path = "crates/oas-perceive" }
oas-obs = { path = "crates/oas-obs" }
oas-flow = { path = "crates/oas-flow" }
oas-ocr = { path = "crates/oas-ocr" }
oas-runtime = { path = "crates/oas-runtime" }
oas-task = { path = "crates/oas-task" }
oas-adapter-pc = { path = "crates/oas-adapter-pc" }
